[project]
name = "trellis-rag"
version = "0.1.0"
description = "Trellis RAG seams: document source, chunker, embedder, vector store, retriever, plus in-memory implementations."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "trellis-core",
]

# No provider extras are declared on purpose. An embedding API client, pgvector/Qdrant or an LLM SDK
# is a product decision (see src/trellis_rag/registry.py): the product adds the dependency and
# registers its plugin through the entry point groups. Declaring empty extras here would only
# advertise support that does not exist.

[tool.uv.sources]
trellis-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
